<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Annotator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Smart Annotator</h1>
      <p>ブラウザだけで使える軽量アノテーションツール</p>
    </div>
    <div class="top-actions">
      <label class="btn primary">画像を追加<input id="fileInput" type="file" accept="image/*" multiple hidden></label>
      <button id="exportProjectBtn" class="btn">Project JSON</button>
      <button id="exportCocoBtn" class="btn">COCO JSON</button>
      <button id="exportYoloBtn" class="btn">YOLO ZIP</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar left">
      <section>
        <h2>画像</h2>
        <div id="imageList" class="image-list empty">画像を追加してください</div>
      </section>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <button class="tool active" data-tool="box">矩形</button>
        <button class="tool" data-tool="polygon">ポリゴン</button>
        <button class="tool" data-tool="select">選択</button>
        <span class="spacer"></span>
        <button id="undoBtn" class="btn small">Undo</button>
        <button id="deleteBtn" class="btn small danger">削除</button>
      </div>

      <div id="stageWrap" class="stage-wrap">
        <div id="emptyState" class="empty-state">
          <strong>画像をドラッグ&ドロップ</strong>
          <span>または上の「画像を追加」から読み込んでください</span>
        </div>
        <canvas id="canvas"></canvas>
      </div>

      <div class="statusbar">
        <span id="imageStatus">0 / 0</span>
        <span id="annotationStatus">0 annotations</span>
        <span class="hint">矩形: ドラッグ / Polygon: クリック、Enterで確定、Escで取消</span>
      </div>
    </section>

    <aside class="sidebar right">
      <section>
        <div class="section-title">
          <h2>クラス</h2>
          <button id="addClassBtn" class="icon-btn" title="クラス追加">＋</button>
        </div>
        <div id="classList" class="class-list"></div>
      </section>

      <section>
        <h2>選択中</h2>
        <div id="selectionPanel" class="selection-panel muted">アノテーションを選択してください</div>
      </section>

      <section class="ai-placeholder">
        <h2>AI補助</h2>
        <p>次の段階でSAM / WebGPUによる自動輪郭生成を追加します。</p>
        <button class="btn" disabled>AIで選択（準備中）</button>
      </section>
    </aside>
  </main>

  <input id="projectInput" type="file" accept=".json,application/json" hidden>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
